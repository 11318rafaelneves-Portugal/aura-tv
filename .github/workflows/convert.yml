name: Converter Lista para HLS

on:
  schedule:
    - cron: '0 4 * * *' # Corre automaticamente todos os dias às 4h da manhã
  workflow_dispatch: # Permite correr manualmente a qualquer momento

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Processar e Converter Lista M3U
        run: |
          # Descarrega a lista original M3UPT
          curl -s https://raw.githubusercontent.com/m3upt/m3upt.github.io/master/m3upt.m3u -o original.m3u
          
          # Converte links para formato HLS e organiza
          sed 's/\.ts/\.m3u8/g' original.m3u > lista_hls.m3u

      - name: Guardar Lista Atualizada
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Atualização automática da lista HLS"
          file_pattern: "lista_hls.m3u"
